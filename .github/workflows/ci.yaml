name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11.0 is the SDK floor declared in pubspec.yaml; `stable` catches
        # anything a newer analyzer starts objecting to.
        sdk: ['3.11.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      - name: Verify formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  # The lower bounds in pubspec.yaml are a promise to anyone resolving against
  # an older set of packages. This job keeps that promise honest.
  oldest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'

      # Only the runtime dependencies are floored. A bare `dart pub downgrade`
      # would also floor the test runner's own transitive packages, which then
      # fail to load on a modern SDK for reasons that say nothing about this
      # package.
      - run: dart pub downgrade asn1lib crypto dart_jsonwebtoken pointycastle uuid
      - run: dart pub deps --style=compact
      - run: dart test

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart pub publish --dry-run
